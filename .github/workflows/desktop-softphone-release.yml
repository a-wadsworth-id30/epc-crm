name: Desktop Softphone Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "desktop/softphone package version to release"
        required: false
  push:
    tags:
      - "desktop-softphone-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            platform: mac
            os: macos-latest
            makeArgs: "--platform=darwin --arch=arm64"
          - label: Windows x64
            platform: windows
            os: windows-latest
            makeArgs: "--platform=win32 --arch=x64"
    defaults:
      run:
        working-directory: desktop/softphone
    env:
      DESKTOP_SOFTPHONE_PUBLIC_BASE_URL: ${{ vars.DESKTOP_SOFTPHONE_PUBLIC_BASE_URL }}
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/softphone/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"

          if [[ -n "${REQUESTED_VERSION}" && "${REQUESTED_VERSION}" != "${package_version}" ]]; then
            echo "::error::Workflow input version ${REQUESTED_VERSION} does not match desktop/softphone package version ${package_version}."
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#desktop-softphone-v}"
            if [[ "${tag_version}" != "${package_version}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match desktop/softphone package version ${package_version}."
              exit 1
            fi
          fi

          if [[ -z "${DESKTOP_SOFTPHONE_PUBLIC_BASE_URL}" ]]; then
            echo "::error::Set repository variable DESKTOP_SOFTPHONE_PUBLIC_BASE_URL to the public downloads folder, for example https://downloads.example.com/desktop-softphone."
            exit 1
          fi

      - name: Bake update feed URL
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const baseUrl = process.env.DESKTOP_SOFTPHONE_PUBLIC_BASE_URL.replace(/\/$/, "");

          fs.writeFileSync(
            "src/release-config.json",
            `${JSON.stringify({ updateBaseUrl: `${baseUrl}/updates`, updateRepo: null }, null, 2)}\n`,
          );
          NODE

      - name: Make desktop package
        run: npm run make -- ${{ matrix.makeArgs }}

      - name: Prepare public release assets
        run: node ../../scripts/desktop-softphone/prepare-release-assets.mjs --platform=${{ matrix.platform }}

      - name: Upload prepared assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-softphone-${{ matrix.platform }}
          path: desktop/softphone/.release/public
          if-no-files-found: error

  publish:
    name: Publish public downloads
    runs-on: ubuntu-latest
    needs: build
    env:
      R2_ACCOUNT_ID: ${{ secrets.DESKTOP_SOFTPHONE_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.DESKTOP_SOFTPHONE_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_SOFTPHONE_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.DESKTOP_SOFTPHONE_R2_BUCKET }}
      R2_PREFIX: ${{ vars.DESKTOP_SOFTPHONE_R2_PREFIX || 'desktop-softphone' }}
      PUBLIC_BASE_URL: ${{ vars.DESKTOP_SOFTPHONE_PUBLIC_BASE_URL }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-softphone-*
          path: release-assets
          merge-multiple: true

      - name: Validate publishing configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${R2_ACCOUNT_ID:?Set DESKTOP_SOFTPHONE_R2_ACCOUNT_ID secret.}"
          : "${R2_ACCESS_KEY_ID:?Set DESKTOP_SOFTPHONE_R2_ACCESS_KEY_ID secret.}"
          : "${R2_SECRET_ACCESS_KEY:?Set DESKTOP_SOFTPHONE_R2_SECRET_ACCESS_KEY secret.}"
          : "${R2_BUCKET:?Set DESKTOP_SOFTPHONE_R2_BUCKET secret.}"
          : "${PUBLIC_BASE_URL:?Set DESKTOP_SOFTPHONE_PUBLIC_BASE_URL repository variable.}"

      - name: Configure R2 credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Upload to Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync release-assets "s3://${R2_BUCKET}/${R2_PREFIX}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --cache-control "public,max-age=300"

      - name: Release summary
        shell: bash
        run: |
          {
            echo "### Desktop softphone downloads"
            echo
            echo "- macOS: ${PUBLIC_BASE_URL%/}/latest/iD30-Softphone-macOS-arm64.zip"
            echo "- Windows: ${PUBLIC_BASE_URL%/}/latest/iD30-Softphone-Windows-x64.exe"
            echo "- Updates: ${PUBLIC_BASE_URL%/}/updates"
          } >> "$GITHUB_STEP_SUMMARY"
