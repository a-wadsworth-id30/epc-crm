name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://crm:crm_password@127.0.0.1:5432/id30_crm_test?schema=public
      APP_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: iD30 CRM
      SESSION_COOKIE_NAME: id30_crm_session
      SESSION_TTL_DAYS: "7"
      CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_password
          POSTGRES_DB: id30_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d id30_crm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Wait for database
        run: |
          node - <<'NODE'
          const net = require("node:net");
          const started = Date.now();
          const timeoutMs = 30000;

          function check() {
            const socket = net.connect(5432, "127.0.0.1");
            socket.once("connect", () => {
              socket.end();
              process.exit(0);
            });
            socket.once("error", () => {
              socket.destroy();
              if (Date.now() - started > timeoutMs) {
                console.error("Postgres did not become reachable in time.");
                process.exit(1);
              }
              setTimeout(check, 1000);
            });
          }

          check();
          NODE

      - name: Migrate test database
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
