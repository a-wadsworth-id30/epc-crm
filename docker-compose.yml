services:
  postgres:
    image: postgres:16-alpine
    container_name: epc-crm-live-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: epc_crm_live
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_password
    ports:
      - "5434:5432"
    volumes:
      - epc_crm_live_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d epc_crm_live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  epc_crm_live_postgres:
