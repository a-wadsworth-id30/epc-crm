<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iD30 Attribution Local Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        max-width: 720px;
        line-height: 1.5;
      }

      .panel {
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 20px;
      }

      label {
        display: block;
        margin: 12px 0;
      }

      input,
      textarea,
      button {
        display: block;
        margin-top: 4px;
        padding: 10px;
        width: 100%;
        max-width: 420px;
      }
    </style>
    <script src="http://localhost:3001/attribution.js" data-id30-attribution defer></script>
  </head>
  <body>
    <h1>Attribution.js Local Test</h1>

    <div class="panel">
      <p>
        Visible phone number:
        <strong data-crm-phone>01234 567890</strong>
      </p>

      <p>
        Telephone link:
        <a href="tel:01234567890">01234 567890</a>
      </p>

      <p>
        Plain text phone number: 01234 567890
      </p>
    </div>

    <form class="panel" style="margin-top: 24px">
      <h2>Test Form</h2>
      <label>
        Name
        <input name="name" value="Local Attribution Test" />
      </label>
      <label>
        Email
        <input name="email" type="email" value="test@example.com" />
      </label>
      <label>
        Phone
        <input name="phone" value="01234 567890" />
      </label>
      <label>
        Message
        <textarea name="message">Testing local attribution capture.</textarea>
      </label>
      <button type="submit">Submit test form</button>
    </form>
  </body>
</html>
